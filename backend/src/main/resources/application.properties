# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=parking-reservation-backend

# Active Profile (default: mysql)
spring.profiles.active=mysql

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/parking_reservation_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization (Sample data)
spring.sql.init.mode=never

# JWT Configuration
app.jwt.secret=9a3f2c4e6b8a1d5f7e9c2b4a6d8f0e1c3b5a7d9e1f3a5b7c9d1e3f5a7b9c1d3e
app.jwt.expiration-ms=86400000

# Overstay Penalty Configuration
app.parking.grace-period-minutes=15
app.parking.penalty-multiplier=1.5
