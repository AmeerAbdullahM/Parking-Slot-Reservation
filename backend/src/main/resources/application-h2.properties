# H2 Profile Configuration
server.port=8080
spring.datasource.url=jdbc:h2:mem:parkingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=9a3f2c4e6b8a1d5f7e9c2b4a6d8f0e1c3b5a7d9e1f3a5b7c9d1e3f5a7b9c1d3e
app.jwt.expiration-ms=86400000
app.parking.grace-period-minutes=15
app.parking.penalty-multiplier=1.5
